[package]
exclude = ["target/", "BACKLOG.md"]
name = "codewalk"
version = "0.3.4"
edition = "2024"
rust-version = "1.85"
authors = ["Santh <64453045+santhreal@users.noreply.github.com>"]
license = "MIT OR Apache-2.0"
description = "Walk code trees with binary detection, bounded reads, and scanner-oriented filtering"
keywords = ["filesystem", "directory", "gitignore", "traversal", "security"]
categories = ["filesystem", "development-tools"]
repository = "https://github.com/santhreal/codewalk"
homepage = "https://santh.dev"
readme = "README.md"

[package.metadata.santh]
status = "beta"

[dependencies]
walkkit = { version = "0.1.2" }

[dev-dependencies]
proptest = "=1.9.0"
tempfile = "=3.27.0"

[workspace]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
panic = "deny"
