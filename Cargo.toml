[package]
exclude = ["target/", "BACKLOG.md"]
name = "codewalk"
version = "0.3.2"
edition = "2024"
rust-version = "1.85"
authors = ["Santh Project <contact@santh.dev>"]
license = "MIT OR Apache-2.0"
description = "Walk code trees with binary detection, bounded reads, and scanner-oriented filtering"
keywords = ["filesystem", "directory", "gitignore", "traversal", "security"]
categories = ["filesystem", "development-tools"]
repository = "https://github.com/santhreal/codewalk"
homepage = "https://santh.dev"
readme = "README.md"

[dependencies]
walkkit = { version = "0.1.0" }

[dev-dependencies]
proptest = "=1.9.0"
tempfile = "=3.27.0"

[workspace]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
panic = "deny"
